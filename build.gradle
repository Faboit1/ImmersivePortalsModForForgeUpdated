plugins {
    id 'java-library'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.148'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

// Mojang ships Java 25 to end users in 26.2
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

neoForge {
    version = project.neo_version
    
    // META-INF/accesstransformer.cfg is detected automatically
    
    runs {
        client {
            client()
        }
        
        server {
            server()
            programArgument '--nogui'
        }
        
        configureEach {
            gameDirectory = project.file('run')
            logLevel = org.slf4j.event.Level.DEBUG
        }
    }
    
    mods {
        "${mod_id}" {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

tasks.named('processResources', ProcessResources) {
    def props = [
        mod_id                 : project.mod_id,
        mod_version            : project.mod_version,
        minecraft_version_range: project.minecraft_version_range,
        neo_version_range      : project.neo_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/neoforge.mods.toml') {
        expand props
    }
}

tasks.named('jar', Jar) {
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}-neoforge.jar"
    from 'LICENSE'
    manifest {
        attributes([
            'Specification-Title'   : 'Immersive Portals',
            'Specification-Vendor'  : 'qouteall',
            'Specification-Version' : '1',
            'Implementation-Title'  : project.name,
            'Implementation-Version': project.mod_version,
            'Implementation-Vendor' : 'qouteall, Nick1st',
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('mcmodsrepo')
        }
    }
}
