plugins {
    id 'java'
    id 'idea'
    id 'eclipse'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[7.0.29,8)'
}

version = project.mod_version
group = project.maven_group
base.archivesName = project.archives_base_name

// Mojang ships Java 25 to end users in 26.1+
java.toolchain.languageVersion = JavaLanguageVersion.of(25)

def mixinConfigs = [
    'imm_ptl.mixins.json',
    'imm_ptl_platform.mixins.json',
    'imm_ptl_peripheral.mixins.json',
    'q_misc_util.mixins.json',
]

minecraft {
    // Applies META-INF/accesstransformer.cfg to the Minecraft dependency
    accessTransformer = true

    runs {
        configureEach {
            workingDir.convention layout.projectDirectory.dir('run')
            systemProperty 'forge.logging.console.level', 'debug'
            mixinConfigs.each { args "--mixin.config=${it}" }
        }

        register('client')

        register('server') {
            args '--nogui'
        }
    }
}

repositories {
    minecraft.mavenizer(it)
    maven fg.forgeMaven
    maven fg.minecraftLibsMaven
    mavenCentral()
}

dependencies {
    implementation minecraft.dependency("net.minecraftforge:forge:${project.minecraft_version}-${project.forge_version}")
    annotationProcessor 'net.minecraftforge:eventbus-validator:7.0.5'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs += ['-Xmaxerrs', '100000']
}

tasks.named('processResources', ProcessResources) {
    def props = [
        mod_id               : project.mod_id,
        mod_version          : project.mod_version,
        minecraft_version_range: project.minecraft_version_range,
        forge_version_range  : project.forge_version_range,
        loader_version_range : project.loader_version_range,
    ]
    inputs.properties props
    filesMatching('META-INF/mods.toml') {
        expand props
    }
}

tasks.named('jar', Jar) {
    archiveFileName = "${project.archives_base_name}-${project.mod_version}-mc${project.minecraft_version}-forge.jar"
    from 'LICENSE'
    manifest {
        attributes([
            'Specification-Title'     : 'Immersive Portals',
            'Specification-Vendor'    : 'qouteall',
            'Specification-Version'   : '1',
            'Implementation-Title'    : project.name,
            'Implementation-Version'  : project.mod_version,
            'Implementation-Vendor'   : 'qouteall, Nick1st',
            // Mixin picks up our configs from the manifest at runtime
            'MixinConfigs'            : mixinConfigs.join(','),
        ])
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.projectDirectory.dir('mcmodsrepo')
        }
    }
}
